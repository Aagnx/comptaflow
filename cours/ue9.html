<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UE9 — Comptabilité | Comptaflow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231E40AF'/><text x='50' y='72' font-size='70' font-weight='bold' text-anchor='middle' fill='%232DD4BF' font-family='Arial'>C</text></svg>">
<style>
:root{--blue-50:#EFF6FF;--blue-100:#DBEAFE;--blue-400:#60A5FA;--blue-500:#3B82F6;--blue-600:#2563EB;--blue-800:#1E40AF;--teal-50:#F0FDFA;--teal-200:#99F6E4;--teal-400:#2DD4BF;--teal-500:#14B8A6;--teal-600:#0D9488;--teal-700:#0F766E;--slate-100:#F1F5F9;--slate-200:#E2E8F0;--slate-400:#94A3B8;--slate-500:#64748B;--slate-800:#1E293B;--slate-900:#0F172A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--blue-50);color:var(--slate-800)}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:60px;background:#fff;border-bottom:1px solid var(--blue-100)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--blue-800);display:flex;align-items:center;justify-content:center;color:var(--teal-400);font-size:18px;font-weight:700}
.logo-name{font-size:17px;font-weight:600;color:var(--slate-900)}
.logo-name span{color:var(--blue-500)}
.back-link{font-size:14px;color:var(--slate-500);text-decoration:none}
.back-link:hover{color:var(--slate-900)}
.header{padding:48px 40px;background:#fff;border-bottom:1px solid var(--blue-100)}
.header-inner{max-width:820px;margin:0 auto}
.tag{display:inline-block;background:var(--teal-50);color:var(--teal-600);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:12px}
.header h1{font-size:32px;font-weight:700;color:var(--slate-900);margin-bottom:8px}
.header p{font-size:15px;color:var(--slate-500)}
.content{max-width:820px;margin:0 auto;padding:40px}
.fiche-card{background:#fff;border:1px solid var(--blue-100);border-radius:14px;padding:24px;margin-bottom:16px;transition:border-color .15s,box-shadow .15s}
.fiche-card:hover{border-color:var(--blue-400);box-shadow:0 2px 12px rgba(59,130,246,.08)}
.fiche-chapitre{font-size:11px;font-weight:600;color:var(--teal-600);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.fiche-titre{font-size:18px;font-weight:600;color:var(--slate-900);margin-bottom:10px}
.fiche-resume{font-size:14px;color:var(--slate-500);line-height:1.6;margin-bottom:14px}
.points-list{list-style:none;margin-bottom:14px}
.points-list li{font-size:13px;color:var(--slate-800);padding:5px 0;display:flex;gap:8px;align-items:flex-start}
.points-list li::before{content:"→";color:var(--blue-600);flex-shrink:0}
.comptes{display:flex;flex-wrap:wrap;gap:6px}
.compte-chip{background:var(--blue-50);border:1px solid var(--blue-100);color:var(--blue-700);font-size:11px;padding:4px 10px;border-radius:6px;font-family:monospace}
.loading{color:var(--slate-400);text-align:center;padding:40px}
@media(max-width:768px){nav{padding:0 20px}.header{padding:32px 20px}.content{padding:24px 20px}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><div class="logo-mark">C</div><span class="logo-name">Compta<span>flow</span></span></a>
  <a class="back-link" href="/">← Retour à l'accueil</a>
</nav>
<div class="header">
  <div class="header-inner">
    <div class="tag">UE 9</div>
    <h1>Comptabilité</h1>
    <p>Toutes les fiches de cours de l'UE9 — clique pour réviser chaque notion.</p><a href="/exercices/ue9.html" style="display:inline-block;margin-top:16px;background:#3B82F6;color:#fff;text-decoration:none;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600">✏️ S'entraîner sur l'UE9 →</a>
  </div>
</div>
<div class="content" id="fiches-container">
  <p class="loading">Chargement des fiches...</p>
</div>
<script>
fetch('/data/ue9-fiches.json')
  .then(function(r){return r.json();})
  .then(function(data){
    var container=document.getElementById('fiches-container');
    container.innerHTML='';
    data.fiches.forEach(function(f){
      var card=document.createElement('div');
      card.className='fiche-card';
      card.style.cursor='pointer';
      card.onclick=function(){window.location.href='/cours/fiche.html?id='+f.id;};
      var points=f.points_cles.map(function(p){return '<li>'+p+'</li>';}).join('');
      var comptes=f.comptes.map(function(c){return '<span class="compte-chip">'+c+'</span>';}).join('');
      card.innerHTML='<div class="fiche-chapitre">'+f.chapitre+'</div>'+
        '<div class="fiche-titre">'+f.titre+'</div>'+
        '<div class="fiche-resume">'+f.resume+'</div>'+
        '<ul class="points-list">'+points+'</ul>'+
        '<div class="comptes">'+comptes+'</div>';
      container.appendChild(card);
    });
  })
  .catch(function(){
    document.getElementById('fiches-container').innerHTML='<p class="loading" style="color:#EF4444">Erreur de chargement des fiches.</p>';
  });
</script>
</body>
</html>
