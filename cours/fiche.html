<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche — Comptaflow</title>
<link rel="stylesheet" href="fiche-detail.css">
</head>
<body>

<header class="topbar">
<div class="wrap">
<a class="brand" href="../index.html">Compta<span>flow</span></a>
<a class="back" href="ue9.html">← UE9 · Introduction à la comptabilité</a>
</div>
</header>

<main class="wrap" id="app">
<div class="state"><div class="spin"></div>Chargement de la fiche…</div>
</main>

<footer class="foot wrap">Comptaflow — Révisions DCG</footer>

<script>
// ---------------------------------------------------------------------------
// Renderer générique de fiche.
// Pour ajouter une fiche : crée un nouveau fichier data/ue9/{numero}.json
// (un seul fichier autonome, aucune autre fichier à modifier).
// URL : fiche.html?id=9 ou fiche.html?id=ue9-ch9 (les deux marchent)
// Ce fichier vit dans cours/ ; les fiches sont dans data/ue9/ à la racine → ../data/ue9/
// ---------------------------------------------------------------------------
const DATA_DIR = '../data/ue9/';
const app = document.getElementById('app');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function sectionHead(tagClass, tagText, title) {
return `<div class="section-head">
<span class="section-tag ${tagClass}">${esc(tagText)}</span>
<h2>${esc(title)}</h2>
</div>`;
}

function renderNotion(n) {
let inner = '';
if (n.reference) inner += `<span class="ref">${esc(n.reference)}</span>`;
inner += `<h3>${esc(n.titre)}</h3>`;
if (n.formule) inner += `<div class="formule">${esc(n.formule)}</div>`;
if (n.contenu) inner += `<p>${esc(n.contenu)}</p>`;
if (n.liste) inner += renderListe(n.liste);
if (n.tableau) inner += renderTable(n.tableau);
if (n.timeline) inner += renderTimeline(n.timeline);
if (n.visuel) inner += renderVisuel(n.visuel);
if (n.exemple) inner += renderExemple(n.exemple);
return `<div class="notion">${inner}</div>`;
}

function renderListe(items) {
const rows = items.map(it => `<li><span class="role-label">${esc(it.label)}</span> — ${esc(it.texte)}</li>`).join('');
return `<ul class="liste-roles">${rows}</ul>`;
}

function renderExemple(texte) {
return `<div class="exemple-box"><span class="exemple-tag">Exemple</span><p>${esc(texte)}</p></div>`;
}

// ---- Découpage en parties / sous-parties (facultatif, rétrocompatible) ----
// ---- Dégradés par partie : 4 familles de teintes qui alternent pour que deux
// parties consécutives n'aient jamais la même couleur ----
const PARTIE_GRADIENTS = [
['#238689', '#25C5E9'], // 1 — cyan → sky
['#021225', '#1B6669'], // 2 — encre → cyan foncé
['#1F6B4A', '#14523A'], // 3 — vert → vert foncé
['#106E85', '#25C5E9'], // 4 — sky foncé → sky
['#238689', '#1B6669'], // 5 — cyan → cyan foncé
['#021225', '#106E85'], // 6 — encre → sky foncé
['#1F6B4A', '#0B4A52'] // 7 — vert → sarcelle foncé
];
// Teintes de fond claires assorties à chaque famille ci-dessus (même ton, en très clair)
const ZONE_TINTS = [
['#EEF9F8', '#DBF0ED'], // 1 — cyan clair
['#EEF2F4', '#DEE7EB'], // 2 — encre clair
['#EDF9F1', '#DAF0E1'], // 3 — vert clair
['#EBF8FC', '#D4EFFA'], // 4 — sky clair
['#EBF6F5', '#D6EDE9'], // 5 — cyan clair (variante)
['#EEF1F3', '#DCE5E9'], // 6 — encre clair (variante)
['#EDF8F0', '#D8EEDF'] // 7 — vert clair (variante)
];
function partieColors(num) {
const i = (parseInt(num, 10) - 1 + PARTIE_GRADIENTS.length) % PARTIE_GRADIENTS.length;
return PARTIE_GRADIENTS[i] || PARTIE_GRADIENTS[0];
}
function zoneTint(num) {
const i = (parseInt(num, 10) - 1 + ZONE_TINTS.length) % ZONE_TINTS.length;
return ZONE_TINTS[i] || ZONE_TINTS[0];
}
function zoneStyle(num) {
const [a] = partieColors(num);
const [la, lb] = zoneTint(num);
return `--zc:${hexToRgb(a)};--zc-a:${la};--zc-b:${lb}`;
}
function renderPartieMarker(p) {
if (!p) return '';
const [a, b] = partieColors(p.num);
return `<div class="partie-marker" id="${esc(p.ancre || '')}">
<span class="partie-num" style="background:linear-gradient(135deg, ${a}, ${b})">${esc(p.num)}</span>
<h2 class="partie-titre">${esc(p.titre)}</h2>
</div>`;
}
function sommaireLookup(sommaire) {
const map = {};
(sommaire || []).forEach(p => {
if (p.ancre) map[p.ancre] = p;
(p.sousParties || []).forEach(sp => { if (sp.ancre) map[sp.ancre] = sp; });
});
return map;
}

function hexToRgb(hex) {
const h = hex.replace('#', '');
return `${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)}`;
}

function renderNotionsWithDividers(list) {
// Regroupe les notions par partie pour pouvoir envelopper chaque groupe
// dans une zone de fond teintée (facultatif, actif seulement si les
// notions portent un champ "partie").
const groups = [];
let current = { partie: null, items: [] };
groups.push(current);
list.forEach(n => {
if (n.partie) {
current = { partie: n.partie, items: [] };
groups.push(current);
}
current.items.push(n);
});

return groups.map(g => {
let inner = '';
let lastSous = null;
let colorA = null;
if (g.partie) {
const [a, b] = partieColors(g.partie.num);
colorA = a;
inner += `<div class="partie-marker" id="${esc(g.partie.ancre || '')}">
<span class="partie-num" style="background:linear-gradient(135deg, ${a}, ${b})">${esc(g.partie.num)}</span>
<h2 class="partie-titre">${esc(g.partie.titre)}</h2>
</div>`;
}
g.items.forEach(n => {
if (n.sousPartie && n.sousPartie.lettre !== lastSous) {
inner += `<div class="sous-marker" id="${esc(n.sousPartie.ancre || '')}">
<span class="sous-lettre" style="border-color:${colorA};color:${colorA}">${esc(n.sousPartie.lettre)}</span>
<h3 class="sous-titre">${esc(n.sousPartie.titre)}</h3>
</div>`;
lastSous = n.sousPartie.lettre;
}
inner += renderNotion(n);
});
if (g.partie) {
return `<div class="partie-zone" style="${zoneStyle(g.partie.num)}">${inner}</div>`;
}
return inner;
}).join('');
}

// ---- Sommaire cliquable (facultatif) ----
function renderSommaire(s) {
const items = s.map(part => {
const [a, b] = partieColors(part.num);
const dot = `<span class="sommaire-dot" style="background:linear-gradient(135deg, ${a}, ${b})"></span>`;
const subs = part.sousParties
? `<ul class="sommaire-sub">${part.sousParties.map(sp =>
`<li><a href="#${esc(sp.ancre)}">${esc(sp.lettre)}. ${esc(sp.titre)}</a></li>`).join('')}</ul>`
: '';
const label = `${dot}${esc(part.num)}. ${esc(part.titre)}`;
const head = part.ancre ? `<a href="#${esc(part.ancre)}">${label}</a>` : `<span>${label}</span>`;
return `<li class="sommaire-item">${head}${subs}</li>`;
}).join('');
return `<nav class="sommaire" aria-label="Sommaire de la fiche">
<div class="sommaire-title">Sommaire</div>
<ol class="sommaire-list">${items}</ol>
</nav>`;
}

// ---- Schémas visuels ----
function renderVisuel(v) {
switch (v.type) {
case 'flux': return renderFlux(v);
case 'pyramide': return renderPyramide(v);
case 'metiers': return renderMetiers(v);
case 'treso-valeur': return renderTresoValeur();
case 'etoile': return renderEtoile(v);
default: return '';
}
}

function renderEtoile(v) {
const cx = 230, cy = 230, R = 168;
const n = v.satellites.length;
const nodes = v.satellites.map((s, i) => {
const angle = (2 * Math.PI / n) * i - Math.PI / 2;
const [nodeColor] = partieColors(i + 1);
return { x: cx + R * Math.cos(angle), y: cy + R * Math.sin(angle), label: s, color: nodeColor };
});
const lines = nodes.map(p =>
`<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" class="etoile-line" style="stroke:url(#etoileLineGrad)"/>`
).join('');
const boxes = nodes.map(p =>
`<foreignObject x="${(p.x - 63).toFixed(1)}" y="${(p.y - 25).toFixed(1)}" width="126" height="50">
<div xmlns="http://www.w3.org/1999/xhtml" class="etoile-node" style="border-top-color:${p.color}">${esc(p.label)}</div>
</foreignObject>`
).join('');
return `<div class="etoile-wrap"><svg viewBox="0 0 460 460" class="etoile-svg" role="img" aria-label="Schéma des relations de l'entreprise avec ses partenaires">
<defs>
<linearGradient id="etoileLineGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#021225" stop-opacity=".5"/>
<stop offset="100%" stop-color="#25C5E9" stop-opacity=".5"/>
</linearGradient>
<linearGradient id="etoileCenterGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#021225"/>
<stop offset="100%" stop-color="#1B6669"/>
</linearGradient>
</defs>
${lines}
${boxes}
<circle cx="${cx}" cy="${cy}" r="58" class="etoile-center-circle" style="fill:url(#etoileCenterGrad)"/>
<foreignObject x="${cx - 58}" y="${cy - 30}" width="116" height="60">
<div xmlns="http://www.w3.org/1999/xhtml" class="etoile-center-label">${esc(v.centre)}</div>
</foreignObject>
</svg></div>`;
}

function renderFlux(v) {
const steps = v.etapes.map((e, i) =>
`<div class="flux-step c-${esc(e.couleur)}">${esc(e.label)}</div>` +
(i < v.etapes.length - 1 ? `<div class="flux-arrow">→</div>` : '')
).join('');
return `<div class="flux">
<div class="flux-row">${steps}</div>
<div class="flux-io">
<span class="flux-tag in">${esc(v.entree)}</span>
<span class="flux-connector"></span>
<span class="flux-tag out">${esc(v.sortie)}</span>
</div>
</div>`;
}

function renderPyramide(v) {
const n = v.tiers.length;
const tiers = v.tiers.map((t, i) => {
const w = (65 + i * (35 / (n - 1))).toFixed(1);
return `<div class="pyr-tier tier-${i}" style="width:${w}%">
<span class="pyr-niveau">${esc(t.niveau)}</span>
<span class="pyr-items">${esc(t.items)}</span>
</div>`;
}).join('');
return `<div class="pyramide">
<div class="pyr-axis"><span>▲ ${esc(v.legende || '')}</span></div>
<div class="pyr-stack">${tiers}</div>
</div>`;
}

function renderMetiers(v) {
const steps = v.roles.map((r, i) =>
`<div class="metier-step c-${esc(r.couleur)}" style="--i:${i}">
<div class="metier-badge">${esc(r.niveau)}</div>
<div class="metier-body">
<div class="metier-top">
<span class="metier-nom">${esc(r.nom)}</span>
<span class="metier-duree">${esc(r.duree)}</span>
</div>
<div class="metier-diplome">${esc(r.diplome)}</div>
<div class="metier-missions">${esc(r.missions)}</div>
</div>
</div>`
).join('');
const pass = (v.passerelles || []).map(p => `<li>${esc(p)}</li>`).join('');
return `<div class="metiers">
<div class="metiers-stair">${steps}</div>
${pass ? `<div class="passerelles"><h4>↔ Passerelles entre parcours</h4><ul>${pass}</ul></div>` : ''}
</div>`;
}

function renderTresoValeur() {
return `<div class="treso">
<svg viewBox="0 0 640 300" role="img" aria-label="Schéma création de valeur vs trésorerie">
<!-- zone de décalage -->
<rect x="185" y="110" width="255" height="140" fill="#F59E0B" opacity="0.12"/>
<!-- axes -->
<line x1="60" y1="45" x2="60" y2="250" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="60" y1="250" x2="605" y2="250" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="52" y="52" text-anchor="end" font-size="13" fill="#64748B">€</text>
<text x="600" y="272" text-anchor="end" font-size="12" fill="#64748B">temps →</text>
<!-- lignes d'événements -->
<line x1="185" y1="60" x2="185" y2="250" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="440" y1="60" x2="440" y2="250" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 4"/>
<!-- création de valeur (violet) : saute à la vente -->
<path d="M60,250 L185,250 L185,110 L600,110" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round"/>
<!-- trésorerie (teal) : saute à l'encaissement -->
<path d="M60,244 L440,244 L440,118 L600,118" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linejoin="round"/>
<circle cx="185" cy="110" r="5" fill="#7C3AED"/>
<circle cx="440" cy="118" r="5" fill="#14B8A6"/>
<!-- libellés événements -->
<text x="185" y="38" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16233A">Vente (T₀)</text>
<text x="185" y="53" text-anchor="middle" font-size="11" fill="#7C3AED">valeur créée</text>
<text x="440" y="38" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16233A">Encaissement</text>
<text x="440" y="53" text-anchor="middle" font-size="11" fill="#14B8A6">trésorerie ↑</text>
<!-- zone label -->
<text x="312" y="180" text-anchor="middle" font-size="11.5" fill="#B45309">Valeur créée,</text>
<text x="312" y="196" text-anchor="middle" font-size="11.5" fill="#B45309">pas encore encaissée</text>
<text x="312" y="212" text-anchor="middle" font-size="10.5" fill="#B45309">(créance client)</text>
<!-- accolade délai -->
<text x="312" y="288" text-anchor="middle" font-size="11.5" fill="#64748B">↔ délai de paiement</text>
</svg>
<div class="treso-legend">
<span><i style="background:#7C3AED"></i> Création de valeur</span>
<span><i style="background:#14B8A6"></i> Trésorerie</span>
<span><i style="background:#FCD9A6"></i> Décalage (créance)</span>
</div>
</div>`;
}

function renderTable(t) {
const head = t.colonnes.map(c => `<th>${esc(c)}</th>`).join('');
const rows = t.lignes.map(r =>
`<tr>${r.map((cell, i) =>
i === 0 ? `<th scope="row">${esc(cell)}</th>` : `<td>${esc(cell)}</td>`
).join('')}</tr>`).join('');
return `<div class="table-scroll"><table class="compare">
<thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderTimeline(items) {
return `<ul class="timeline">${items.map(([y, e]) =>
`<li><span class="year">${esc(y)}</span><span class="event">${esc(e)}</span></li>`
).join('')}</ul>`;
}

function wrapInZone(partieInfo, bodyHtml) {
if (!partieInfo) return bodyHtml;
return `<div class="partie-zone" style="${zoneStyle(partieInfo.num)}">${renderPartieMarker(partieInfo)}${bodyHtml}</div>`;
}

function renderGauge(u, partieInfo) {
const pct = Math.max(0, Math.min(100, Number(u.pourcentage) || 0));
const themes = (u.themesRecurrents || []).map(t => `<li>${esc(t)}</li>`).join('');
const body = `<section class="section">
${sectionHead('t-amber', 'Examen', "Utilité à l'examen")}
<div class="card gauge-card">
<div class="gauge-top">
<div class="gauge-num" data-pct="${pct}">0<small>%</small></div>
<div class="gauge-level">${esc(u.niveau || '')}</div>
</div>
<div class="gauge-track"><div class="gauge-fill" data-pct="${pct}"></div></div>
<div class="gauge-scale"><span>0</span><span>50</span><span>100</span></div>
${u.commentaire ? `<p class="gauge-comment">${esc(u.commentaire)}</p>` : ''}
${themes ? `<div class="themes"><h4>Thèmes les plus fréquents en UE9</h4><ul>${themes}</ul></div>` : ''}
</div>
</section>`;
return wrapInZone(partieInfo, body);
}

function renderVocab(list, partieInfo) {
const rows = list.map(v =>
`<div class="row"><dt>${esc(v.terme)}</dt><dd>${esc(v.definition)}</dd></div>`
).join('');
const body = `<section class="section">
${sectionHead('t-teal', 'Lexique', 'Vocabulaire du chapitre')}
<dl class="vocab">${rows}</dl>
</section>`;
return wrapInZone(partieInfo, body);
}

function renderQuestions(list, partieInfo) {
const items = list.map(q => `<li>${esc(q)}</li>`).join('');
const body = `<section class="section">
${sectionHead('t-violet', 'À réviser', "Questions types qui peuvent tomber")}
<ol class="qlist">${items}</ol>
</section>`;
return wrapInZone(partieInfo, body);
}

function renderAnnales(a, partieInfo) {
let inner = '';
if (a.note) inner += `<p class="annales-note">${esc(a.note)}</p>`;
if (a.entrees && a.entrees.length) {
inner += a.entrees.map(e => `<div class="annale">
<span class="year-tag">Session ${esc(e.annee)}</span>
<h4>${esc(e.question)}</h4>
<div class="corrige"><strong>Corrigé type — </strong>${esc(e.corrige)}</div>
</div>`).join('');
} else {
inner += `<p class="empty">Aucune annale datée renseignée pour l'instant. Ajoute-les dans <code>annales.entrees</code> du JSON (année + question + corrigé).</p>`;
}
if (a.questionsRedactionnellesRecurrentes && a.questionsRedactionnellesRecurrentes.length) {
inner += `<div class="themes"><h4>Questions rédactionnelles récurrentes</h4>
<ul class="recur">${a.questionsRedactionnellesRecurrentes.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>`;
}
const body = `<section class="section">
${sectionHead('t-amber', 'Annales', "Annales officielles liées au chapitre")}
<div class="card annales-card">${inner}</div>
</section>`;
return wrapInZone(partieInfo, body);
}

function renderFiche(f) {
const chips = (f.motsCles || []).map(m => `<span class="chip">${esc(m)}</span>`).join('');
let html = `<header class="fiche-header">
<p class="eyebrow">${esc(f.axe || 'UE9 · Introduction à la comptabilité')}</p>
<span class="fiche-num">Fiche N°${esc(f.numero)}${f.pageManuel ? ` · p.${esc(f.pageManuel)}` : ''}</span>
<h1 class="fiche-title">${esc(f.titre)}</h1>
${chips ? `<div class="motscles">${chips}</div>` : ''}
<div class="header-actions">
<a class="btn-exos" href="${esc(f.exercicesUrl || '#')}">
Exercices d'application du chapitre <span class="arrow">→</span>
</a>
</div>
</header>`;

if (f.formatEpreuve) html += `<p class="format-note">${esc(f.formatEpreuve)}</p>`;

if (f.sommaire) html += renderSommaire(f.sommaire);

if (f.notionsCles && f.notionsCles.length) {
html += `<section class="section">
${sectionHead('t-blue', 'Cours', 'Notions clés du chapitre')}
${renderNotionsWithDividers(f.notionsCles)}
</section>`;
}
const sMap = f.sommaire ? sommaireLookup(f.sommaire) : {};
if (f.utilite) html += renderGauge(f.utilite, sMap['sec-utilite']);
if (f.vocabulaire && f.vocabulaire.length) html += renderVocab(f.vocabulaire, sMap['sec-vocab']);
if (f.questionsTypes && f.questionsTypes.length) html += renderQuestions(f.questionsTypes, sMap['sec-questions']);
if (f.annales) html += renderAnnales(f.annales, sMap['sec-annales']);

app.innerHTML = html;
document.title = `Fiche ${f.numero} — ${f.titre} · Comptaflow`;
animateGauge();
}

function animateGauge() {
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fill = document.querySelector('.gauge-fill');
const num = document.querySelector('.gauge-num');
if (!fill || !num) return;
const pct = Number(fill.dataset.pct) || 0;
if (reduce) { fill.style.width = pct + '%'; num.innerHTML = pct + '<small>%</small>'; return; }
requestAnimationFrame(() => { fill.style.width = pct + '%'; });
let start = null;
const dur = 900;
function step(ts) {
if (!start) start = ts;
const p = Math.min(1, (ts - start) / dur);
num.innerHTML = Math.round(p * pct) + '<small>%</small>';
if (p < 1) requestAnimationFrame(step);
}
requestAnimationFrame(step);
}

(async function init() {
const idParam = new URLSearchParams(location.search).get('id');
// Normalise vers un numéro de fiche : accepte "9" ou "ue9-ch9"
let numero = idParam;
if (idParam) {
const m = idParam.match(/(\d+)\s*$/);
if (m) numero = m[1];
}
if (!numero) numero = '1';
try {
const res = await fetch(DATA_DIR + numero + '.json', { cache: 'no-store' });
if (!res.ok) throw new Error('HTTP ' + res.status);
const fiche = await res.json();
renderFiche(fiche);
} catch (err) {
app.innerHTML = `<div class="state">Fiche introuvable${idParam ? ` (id « ${esc(idParam)} »)` : ''}.<br>
<small>${esc(err.message)} — vérifie que le fichier data/ue9/${esc(numero)}.json existe.</small>
<br><a class="back" href="ue9.html">← Retour à l'UE9</a></div>`;
}
})();
</script>
</body>
</html>
