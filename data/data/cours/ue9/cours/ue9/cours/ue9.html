<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UE9 — Comptabilité | Comptaflow</title>
<style>
:root{--blue-50:#EFF6FF;--blue-100:#DBEAFE;--blue-500:#3B82F6;--blue-600:#2563EB;--blue-800:#1E40AF;--teal-400:#2DD4BF;--teal-500:#14B8A6;--teal-600:#0D9488;--slate-500:#64748B;--slate-800:#1E293B;--slate-900:#0F172A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--blue-50);color:var(--slate-800)}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:60px;background:#fff;border-bottom:1px solid var(--blue-100)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--blue-800);display:flex;align-items:center;justify-content:center;color:var(--teal-400);font-size:18px;font-weight:700}
.logo-name{font-size:17px;font-weight:600;color:var(--slate-900)}
.logo-name span{color:var(--blue-500)}
.header{padding:48px 40px;background:#fff;border-bottom:1px solid var(--blue-100)}
.header-inner{max-width:800px;margin:0 auto}
.tag{display:inline-block;background:#F0FDFA;color:var(--teal-600);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:12px}
.header h1{font-size:32px;font-weight:700;color:var(--slate-900)}
.content{max-width:800px;margin:0 auto;padding:40px}
.fiche-card{background:#fff;border:1px solid var(--blue-100);border-radius:14px;padding:24px;margin-bottom:16px}
.fiche-chapitre{font-size:11px;font-weight:600;color:var(--teal-600);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.fiche-titre{font-size:18px;font-weight:600;color:var(--slate-900);margin-bottom:10px}
.fiche-resume{font-size:14px;color:var(--slate-500);line-height:1.6;margin-bottom:14px}
.points-list{list-style:none}
.points-list li{font-size:13px;color:var(--slate-800);padding:6px 0;display:flex;gap:8px}
.points-list li::before{content:"→";color:var(--blue-600)}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><div class="logo-mark">C</div><span class="logo-name">Compta<span>flow</span></span></a>
</nav>
<div class="header">
  <div class="header-inner">
    <div class="tag">UE 9</div>
    <h1>Comptabilité</h1>
  </div>
</div>
<div class="content" id="fiches-container">
  <p style="color:#64748B">Chargement des fiches...</p>
</div>
<script>
fetch('/data/ue9-fiches.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('fiches-container');
    container.innerHTML = '';
    data.fiches.forEach(f => {
      const card = document.createElement('div');
      card.className = 'fiche-card';
      card.innerHTML = `
        <div class="fiche-chapitre">${f.chapitre}</div>
        <div class="fiche-titre">${f.titre}</div>
        <div class="fiche-resume">${f.resume}</div>
        <ul class="points-list">${f.points_cles.map(p => `<li>${p}</li>`).join('')}</ul>
      `;
      container.appendChild(card);
    });
  })
  .catch(() => {
    document.getElementById('fiches-container').innerHTML = '<p style="color:#EF4444">Erreur de chargement des fiches.</p>';
  });
</script>
</body>
</html>
