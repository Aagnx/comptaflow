<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche — UE9 Comptabilité · Comptaflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue-50: #EFF6FF;
    --blue-100: #DBEAFE;
    --blue-200: #BFDBFE;
    --blue-500: #3B82F6;
    --blue-600: #2563EB;
    --blue-700: #1D4ED8;
    --teal-400: #2DD4BF;
    --teal-500: #14B8A6;
    --teal-600: #0D9488;
    --slate-400: #94A3B8;
    --slate-500: #64748B;
    --slate-700: #334155;
    --slate-800: #1E293B;
    --slate-900: #0F172A;
    --amber-50: #FFFBEB;
    --amber-100: #FEF3C7;
    --amber-500: #F59E0B;
  }

  body { font-family: 'Inter', sans-serif; background: #fff; color: var(--slate-800); line-height: 1.6; }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--blue-100);
    padding: 0 24px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-size: 18px; font-weight: 700; color: var(--blue-600); text-decoration: none; letter-spacing: -0.3px; }
  .nav-logo span { color: var(--teal-500); }
  .nav-links { display: flex; gap: 24px; align-items: center; }
  .nav-links a { font-size: 14px; font-weight: 500; color: var(--slate-500); text-decoration: none; transition: color 0.15s; }
  .nav-links a:hover { color: var(--blue-600); }
  .nav-cta { background: var(--blue-600); color: #fff !important; padding: 8px 16px; border-radius: 8px; font-size: 13px !important; }

  /* LAYOUT */
  .layout {
    max-width: 760px; margin: 0 auto;
    padding: 0 24px 64px;
  }

  /* BREADCRUMB */
  .breadcrumb {
    padding: 16px 0 0;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--slate-400);
  }
  .breadcrumb a { color: var(--blue-500); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }

  /* FICHE HEADER */
  .fiche-header {
    padding: 24px 0 28px;
    border-bottom: 1px solid var(--blue-100);
    margin-bottom: 32px;
  }
  .fiche-meta-top {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .tag-theme {
    font-size: 11px; font-weight: 600; color: var(--teal-600);
    background: #F0FDFA; border: 1px solid #CCFBF1;
    padding: 3px 10px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .tag-duree {
    font-size: 12px; color: var(--slate-400);
    display: flex; align-items: center; gap: 4px;
  }
  .tag-niveau {
    font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .niveau-essentiel { background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; }
  .niveau-avance    { background: #FFF7ED; color: #C2410C; border: 1px solid #FED7AA; }

  .fiche-header h1 {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700; letter-spacing: -0.4px;
    color: var(--slate-900); line-height: 1.2;
    margin-bottom: 0;
  }

  /* NAV FICHES (prev/next) */
  .fiche-nav {
    display: flex; justify-content: space-between; gap: 12px;
    margin-bottom: 32px;
  }
  .fiche-nav-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px;
    border: 1.5px solid var(--blue-100);
    background: #fff; color: var(--slate-500);
    font-size: 13px; font-weight: 500;
    text-decoration: none;
    transition: all 0.15s;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .fiche-nav-btn:hover { border-color: var(--blue-500); color: var(--blue-600); }
  .fiche-nav-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

  /* CONTENT BLOCKS */
  .block { margin-bottom: 28px; }

  /* Definition */
  .block-definition {
    background: var(--blue-50);
    border-left: 3px solid var(--blue-500);
    border-radius: 0 10px 10px 0;
    padding: 16px 20px;
  }
  .block-definition .block-title {
    font-size: 11px; font-weight: 600; color: var(--blue-600);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .block-definition p { font-size: 14px; color: var(--slate-700); line-height: 1.65; }

  /* Liste */
  .block-liste .block-title {
    font-size: 14px; font-weight: 600; color: var(--slate-800);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .block-liste .block-title::before {
    content: '';
    width: 3px; height: 16px;
    background: var(--teal-500); border-radius: 2px;
  }
  .block-liste ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .block-liste ul li {
    font-size: 14px; color: var(--slate-700);
    display: flex; align-items: flex-start; gap: 10px;
    line-height: 1.5;
  }
  .block-liste ul li::before {
    content: ''; width: 6px; height: 6px;
    background: var(--teal-400); border-radius: 50%;
    flex-shrink: 0; margin-top: 8px;
  }

  /* Règle */
  .block-regle {
    background: var(--amber-50);
    border: 1px solid var(--amber-100);
    border-radius: 10px; padding: 16px 20px;
  }
  .block-regle .block-title {
    font-size: 11px; font-weight: 600; color: var(--amber-500);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .block-regle .block-title::before { content: '⚡'; font-size: 12px; }
  .block-regle p { font-size: 14px; color: var(--slate-700); line-height: 1.65; }

  /* Exemple / Journal */
  .block-exemple .block-title {
    font-size: 11px; font-weight: 600; color: var(--slate-400);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px;
  }
  .block-exemple .block-libelle {
    font-size: 13px; color: var(--slate-500); margin-bottom: 12px; font-style: italic;
  }
  .journal {
    border: 1.5px solid var(--blue-100); border-radius: 10px; overflow: hidden;
  }
  .journal-header {
    display: grid; grid-template-columns: 90px 1fr 100px 100px;
    background: var(--blue-50);
    padding: 8px 14px;
    font-size: 11px; font-weight: 600;
    color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .journal-row {
    display: grid; grid-template-columns: 90px 1fr 100px 100px;
    padding: 10px 14px;
    border-top: 1px solid var(--blue-100);
    font-size: 14px; align-items: center;
  }
  .journal-row .compte { font-weight: 600; color: var(--blue-600); font-family: monospace; font-size: 13px; }
  .journal-row .libelle { color: var(--slate-700); }
  .journal-row .montant { text-align: right; }
  .journal-row .debit  { color: var(--slate-800); font-weight: 500; }
  .journal-row .credit { color: var(--teal-600); font-weight: 500; }
  .journal-total {
    display: grid; grid-template-columns: 90px 1fr 100px 100px;
    padding: 8px 14px; background: var(--blue-50);
    border-top: 2px solid var(--blue-100);
    font-size: 12px; font-weight: 600; color: var(--slate-500);
  }

  /* FORMAT MÉMO */
  .memo-grid { display: flex; flex-direction: column; gap: 16px; }
  .memo-point {
    border: 1.5px solid var(--blue-100);
    border-radius: 12px; padding: 18px 20px;
  }
  .memo-point:hover { border-color: var(--blue-500); }
  .memo-point-titre {
    font-size: 14px; font-weight: 600; color: var(--slate-800);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .memo-point-titre::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--blue-500); border-radius: 50%;
    flex-shrink: 0;
  }
  .memo-point p { font-size: 14px; color: var(--slate-600); line-height: 1.65; }

  /* LOADING / ERROR */
  #loading { text-align: center; padding: 80px; color: var(--slate-400); font-size: 14px; }
  #error   { text-align: center; padding: 80px; color: #EF4444; font-size: 14px; }

  footer { border-top: 1px solid var(--blue-100); padding: 28px 24px; text-align: center; }
  .footer-logo { font-size: 16px; font-weight: 700; color: var(--blue-600); margin-bottom: 6px; }
  .footer-logo span { color: var(--teal-500); }
  footer p { font-size: 12px; color: var(--slate-400); }

  @media (max-width: 600px) {
    .nav-links a:not(.nav-cta) { display: none; }
    .journal-header, .journal-row, .journal-total {
      grid-template-columns: 70px 1fr 80px 80px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>

<nav>
  <a href="../../index.html" class="nav-logo">Compta<span>flow</span></a>
  <div class="nav-links">
    <a href="../../ue.html">Cours</a>
    <a href="../../index.html#pricing">Tarifs</a>
    <a href="../../index.html#pricing" class="nav-cta">Commencer</a>
  </div>
</nav>

<div class="layout">
  <div class="breadcrumb">
    <a href="../../ue.html">Toutes les UE</a>
    <span>›</span>
    <a href="index.html">UE9 — Comptabilité</a>
    <span>›</span>
    <span id="breadcrumb-titre">Fiche</span>
  </div>

  <div id="loading">Chargement de la fiche…</div>
  <div id="error" style="display:none">Fiche introuvable. <a href="index.html" style="color:var(--blue-500)">Retour aux fiches →</a></div>
  <div id="fiche-content" style="display:none">

    <div class="fiche-header">
      <div class="fiche-meta-top">
        <span class="tag-theme" id="f-theme"></span>
        <span class="tag-duree" id="f-duree"></span>
        <span class="tag-niveau" id="f-niveau"></span>
      </div>
      <h1 id="f-titre"></h1>
    </div>

    <div class="fiche-nav">
      <button class="fiche-nav-btn" id="btn-prev">← Précédente</button>
      <button class="fiche-nav-btn" id="btn-next">Suivante →</button>
    </div>

    <div id="f-body"></div>

    <div class="fiche-nav" style="margin-top:40px; margin-bottom:0;">
      <button class="fiche-nav-btn" id="btn-prev2">← Précédente</button>
      <a href="index.html" class="fiche-nav-btn">↩ Retour aux fiches</a>
      <button class="fiche-nav-btn" id="btn-next2">Suivante →</button>
    </div>
  </div>
</div>

<footer>
  <div class="footer-logo">Compta<span>flow</span></div>
  <p>© 2025 Comptaflow · @comptaflow sur Instagram &amp; TikTok</p>
</footer>

<script>
let allFiches = [];
let currentIndex = 0;

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function init() {
  try {
    const res = await fetch('../../data/ue9-fiches.json');
    const data = await res.json();
    allFiches = data.fiches;

    const id = getParam('id');
    currentIndex = allFiches.findIndex(f => f.id === id);

    if (currentIndex === -1) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      return;
    }

    render(allFiches[currentIndex]);
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Erreur de chargement. ' + e.message;
  }
}

function render(fiche) {
  document.title = `${fiche.titre} — UE9 · Comptaflow`;

  document.getElementById('breadcrumb-titre').textContent = fiche.titre;
  document.getElementById('f-theme').textContent  = fiche.theme;
  document.getElementById('f-duree').textContent  = '⏱ ' + fiche.duree;
  document.getElementById('f-titre').textContent  = fiche.titre;

  const nivEl = document.getElementById('f-niveau');
  if (fiche.niveau === 'avance') {
    nivEl.className = 'tag-niveau niveau-avance';
    nivEl.textContent = 'Avancé';
  } else {
    nivEl.className = 'tag-niveau niveau-essentiel';
    nivEl.textContent = 'Essentiel';
  }

  const body = document.getElementById('f-body');
  if (fiche.format === 'memo') {
    body.innerHTML = renderMemo(fiche);
  } else {
    body.innerHTML = renderStructure(fiche);
  }

  // Prev / Next
  setupNav('btn-prev',  currentIndex - 1);
  setupNav('btn-next',  currentIndex + 1);
  setupNav('btn-prev2', currentIndex - 1);
  setupNav('btn-next2', currentIndex + 1);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('fiche-content').style.display = 'block';
}

function setupNav(btnId, targetIndex) {
  const btn = document.getElementById(btnId);
  if (targetIndex < 0 || targetIndex >= allFiches.length) {
    btn.disabled = true;
  } else {
    btn.disabled = false;
    btn.onclick = () => {
      const target = allFiches[targetIndex];
      window.location.href = `fiche.html?id=${target.id}`;
    };
  }
}

/* ---- RENDER: STRUCTURE ---- */
function renderStructure(fiche) {
  return fiche.sections.map(s => {
    switch(s.type) {
      case 'definition': return blockDefinition(s);
      case 'liste':      return blockListe(s);
      case 'regle':      return blockRegle(s);
      case 'exemple':    return blockExemple(s);
      default:           return '';
    }
  }).join('');
}

function blockDefinition(s) {
  return `<div class="block block-definition">
    <div class="block-title">Définition</div>
    <p>${s.contenu}</p>
  </div>`;
}

function blockListe(s) {
  const items = s.items.map(i => `<li>${i}</li>`).join('');
  return `<div class="block block-liste">
    <div class="block-title">${s.titre}</div>
    <ul>${items}</ul>
  </div>`;
}

function blockRegle(s) {
  return `<div class="block block-regle">
    <div class="block-title">${s.titre}</div>
    <p>${s.contenu}</p>
  </div>`;
}

function blockExemple(s) {
  let total_d = 0, total_c = 0;
  const rows = s.ecritures.map(e => {
    const d = e.debit  !== null ? e.debit  : '';
    const c = e.credit !== null ? e.credit : '';
    if (e.debit)  total_d += e.debit;
    if (e.credit) total_c += e.credit;
    return `<div class="journal-row">
      <span class="compte">${e.compte}</span>
      <span class="libelle">${e.libelle}</span>
      <span class="montant debit">${d !== '' ? fmt(d) : ''}</span>
      <span class="montant credit">${c !== '' ? fmt(c) : ''}</span>
    </div>`;
  }).join('');

  return `<div class="block block-exemple">
    <div class="block-title">Exemple</div>
    <div class="block-libelle">${s.libelle}</div>
    <div class="journal">
      <div class="journal-header">
        <span>Compte</span><span>Libellé</span><span style="text-align:right">Débit</span><span style="text-align:right">Crédit</span>
      </div>
      ${rows}
      <div class="journal-total">
        <span></span><span>Total</span>
        <span style="text-align:right">${fmt(total_d)}</span>
        <span style="text-align:right">${fmt(total_c)}</span>
      </div>
    </div>
  </div>`;
}

/* ---- RENDER: MÉMO ---- */
function renderMemo(fiche) {
  const points = fiche.points.map(p => `
    <div class="memo-point">
      <div class="memo-point-titre">${p.titre}</div>
      <p>${p.contenu}</p>
    </div>`).join('');
  return `<div class="memo-grid">${points}</div>`;
}

/* ---- UTILS ---- */
function fmt(n) {
  return n.toLocaleString('fr-FR', { minimumFractionDigits: 2 }) + ' €';
}

init();
</script>
</body>
</html>
