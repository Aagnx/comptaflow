<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Comptaflow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231E40AF'/><text x='50' y='72' font-size='70' font-weight='bold' text-anchor='middle' fill='%232DD4BF' font-family='Arial'>C</text></svg>">
<style>
:root{--blue-50:#EFF6FF;--blue-100:#DBEAFE;--blue-500:#3B82F6;--blue-700:#1D4ED8;--blue-800:#1E40AF;--teal-400:#2DD4BF;--slate-500:#64748B;--slate-900:#0F172A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--blue-50);color:var(--slate-900);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.card{background:#fff;border:1px solid var(--blue-100);border-radius:20px;padding:48px 40px;max-width:480px}
.icon{font-size:48px;margin-bottom:16px}
h1{font-size:28px;font-weight:700;margin-bottom:12px}
p{font-size:15px;color:var(--slate-500);line-height:1.7;margin-bottom:28px}
.btn{display:inline-block;background:var(--blue-500);color:#fff;text-decoration:none;padding:13px 28px;border-radius:10px;font-size:15px;font-weight:600}
.btn:hover{background:var(--blue-700)}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--blue-800);display:flex;align-items:center;justify-content:center;color:var(--teal-400);font-size:18px;font-weight:700}
.logo-name{font-size:17px;font-weight:600}
.logo-name span{color:var(--blue-500)}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-mark">C</div><span class="logo-name">Compta<span>flow</span></span></div>
  <div class="icon">✅</div>
  <h1>Message envoyé !</h1>
  <p>Merci pour ta question. On te répond le plus vite possible par email.</p>
  <a class="btn" href="/">← Retour à l'accueil</a>
</div>
</body>
</html>
